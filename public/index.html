<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDR Reheat — Robson Menezes Advogados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
            <path d="M12 2C10 6 7 8 7 12a5 5 0 0 0 10 0c0-1.5-.5-2.5-1.3-3.6.2 1.2-.2 2.1-1 2.6.3-2-.4-4-2.7-9Z" fill="url(#flame)"/>
            <defs><linearGradient id="flame" x1="7" y1="2" x2="17" y2="17"><stop stop-color="#FFC65C"/><stop offset="1" stop-color="#F5730A"/></linearGradient></defs>
          </svg>
        </span>
        <div>
          <h1>SDR Reheat</h1>
          <p class="subtitle">Reaquecimento de leads · Robson Menezes Advogados</p>
        </div>
      </div>
      <button id="btnAtualizar" class="btn-ghost" title="Atualizar lista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
        Atualizar
      </button>
    </header>

    <section class="stats" id="stats" aria-live="polite"></section>

    <section class="toolbar">
      <div class="tabs" id="tabsEtapas" role="tablist" aria-label="Filtrar por etapa"></div>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="busca" type="text" placeholder="Buscar por nome…" autocomplete="off">
      </div>
    </section>

    <main id="listaLeads" class="lista" aria-live="polite">
      <div class="skeleton-grid">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </main>

  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
