<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SDR Reheat - Reaquecimento de Leads</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-10">
            <h1 class="text-2xl font-bold text-amber-500">SDR Reheat 🔥</h1>
            <p class="text-slate-400">Leads parados há +2 dias prontos para receber conteúdo.</p>
        </header>

        <div id="listaLeads" class="grid gap-4">
            <p class="text-slate-500">Carregando leads...</p>
        </div>
    </div>

    <script>
        async function carregarLeads() {
            const res = await fetch('/api/leads-reaquecer');
            const leads = await res.json();
            const container = document.getElementById('listaLeads');
            
            if (leads.length === 0) {
                container.innerHTML = "Nenhum lead pendente de reaquecimento.";
                return;
            }

            container.innerHTML = leads.map(l => `
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${l.name}</h3>
                        <p class="text-xs text-slate-400">ID: ${l.id}</p>
                    </div>
                    <button onclick="enviar('${l.id}', '${l.name}', '5581900000000')" class="bg-amber-600 hover:bg-amber-500 px-4 py-2 rounded-lg font-bold text-slate-950">
                        Enviar Vídeo
                    </button>
                </div>
            `).join('');
        }

        async function enviar(id, nome, telefone) {
            const msg = window.encodeURIComponent(`Oi ${nome}, veja esse vídeo: https://youtu.be/...`);
            window.open(`https://web.whatsapp.com/send?phone=${telefone}&text=${msg}`, '_blank');
            
            await fetch(`/api/marcar-enviado/${id}`, { method: 'POST' });
            carregarLeads();
        }

        carregarLeads();
    </script>
</body>
    <script src="app.js"></script>
</html>
